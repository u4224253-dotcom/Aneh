name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # perlu untuk membuat GitHub Release saat push tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project from CfWan.zip
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "Project sudah ada di root, tidak perlu unzip."
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            unzip -q -o CfWan.zip
            echo "PROJECT_DIR=CfWan" >> "$GITHUB_ENV"
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CfWan.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CfWan-apk
          path: CfWan.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CfWan.apk
