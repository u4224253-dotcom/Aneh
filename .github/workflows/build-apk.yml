name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak project dari file zip di repo
        run: |
          ZIP=$(ls ChordFinderIsland*.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then ZIP=$(ls *.zip 2>/dev/null | head -n 1); fi
          if [ -z "$ZIP" ]; then echo "Tidak ada file .zip di root repo"; exit 1; fi
          echo "Memakai zip: $ZIP"
          mkdir -p project
          unzip -q "$ZIP" -d project
          SETTINGS=$(find project -maxdepth 3 -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts tidak ketemu di dalam zip"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ChordFinderIsland-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
